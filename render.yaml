# Render Blueprint — one web service hosts the API, WebSocket (party games) and the React app.
# Database lives on Neon: paste its connection string into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: playnest
    runtime: node
    plan: starter            # free plan works too, but sleeps when idle (drops live party rooms)
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false          # set to your Neon connection string (…?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # optional — enables AI-generated detective cases
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: DETECTIVE_DAILY_LIMIT
        value: "3"
